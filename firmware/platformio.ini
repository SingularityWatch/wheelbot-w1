; =====================================================================================
; WHEELBOT W1 — PlatformIO project
; =====================================================================================
; ESP32-WROOM DevKit 30-pin, Arduino framework, BLE GATT server.
;
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console at 115200
;
; The BLE stack ships with the ESP32 Arduino core, so there is no BLE library here.
; The protocol is a fixed 12-byte binary frame (see src/protocol.h), which is why
; ArduinoJson is deliberately not a dependency: nothing in this firmware parses text.
;
; Either core generation works: platform espressif32 6.x gives Arduino core 2.x,
; 7.x gives core 3.x. The LEDC calls are shimmed for both in src/main.cpp.
; =====================================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags = -Wall

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor

; Decode the backtrace if the chip panics instead of printing a bare hex dump.
monitor_filters = esp32_exception_decoder, time

; 240 MHz: the loop runs at ~1 kHz with a 100 Hz IMU and a 50 Hz servo bus, which a
; 160 MHz part would still manage, but the filter maths benefits from the headroom.
board_build.f_cpu = 240000000L
